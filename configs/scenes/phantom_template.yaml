# Copy this file outside the repository and replace all example paths/coordinates.
# Mesh and centerlines must already be registered in the SAME millimetre frame.
scene_version: 1
kind: from_mesh
mesh_path: phantom_surface.stl
centerline_path: phantom_centerlines.yaml
insertion_position_mm: [0.0, 0.0, 0.0]
insertion_direction_unit: [0.0, 1.0, 0.0]
registration:
  scale_uniform: 1.0
  rotation_yzx_deg: [0.0, 0.0, 0.0]
  translation_xyz_mm: [0.0, 0.0, 0.0]
image_rot_zx_deg: [20.0, 5.0]
image_center_mm: [0.0, 0.0, 0.0]
field_of_view_mm: null
target:
  mode: centerline_random
  branches: [branch_a]
  threshold_mm: 5.0
